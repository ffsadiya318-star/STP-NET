body::after{

.card{

}

@keyframes fade{

from{

}

to{
opacity:1;

}

}

.logo{

font-size:55px;
text-align:center;
color:white;

}

h2{

text-align:center;
color:white;
margin-top:10px;

padding:15px;
border:none;
outline:none;
border-radius:15px;

button{

}

.generate{

.copy{

function copyCode(){
